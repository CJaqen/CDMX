<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { font-family: 'Manrope', system-ui, sans-serif; color: #2B2620; background: linear-gradient(180deg, #F5EDE0 0%, #F0E5D4 100%); min-height: 100vh; }
.font-display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; border: none; outline: none; }

/* Header */
.header { background: linear-gradient(135deg, #2B2620 0%, #1a1714 100%); color: #FBF6EE; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.header-inner { padding: 18px 16px 12px; max-width: 720px; margin: 0 auto; }
.eyebrow { font-size: 10px; letter-spacing: 0.3em; font-weight: 700; color: #D4A04C; text-transform: uppercase; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; color: #FBF6EE; margin-top: 4px; }
h1 em { color: #D4A04C; font-style: italic; font-weight: 400; }
.subtitle { font-size: 12px; color: #A9A299; margin-top: 4px; }
.reset-btn { font-size: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(245,237,224,0.1); color: #F5EDE0; display: inline-flex; align-items: center; gap: 4px; }
.head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

/* Search */
.search-wrap { position: relative; margin-top: 12px; }
.search-input { width: 100%; padding: 8px 12px 8px 32px; font-size: 14px; border-radius: 999px; background: rgba(245,237,224,0.95); color: #2B2620; }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #766C61; }

/* Pills */
.pills-row { margin-top: 12px; margin-left: -16px; margin-right: -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.pills-row::-webkit-scrollbar { display: none; }
.pills { display: flex; gap: 8px; padding-bottom: 4px; width: max-content; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: rgba(245,237,224,0.1); color: #A9A299; border: 1px solid rgba(245,237,224,0.15); transition: all 0.2s; }
.pill.active { color: #FBF6EE; border: none; }
.pill .count { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(212,160,76,0.3); color: #D4A04C; }
.pill.active .count { background: rgba(0,0,0,0.2); color: #FBF6EE; }

.sub-pills { margin-top: 8px; margin-left: -16px; margin-right: -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.sub-pills::-webkit-scrollbar { display: none; }
.sub-pills-inner { display: flex; gap: 6px; padding-bottom: 4px; width: max-content; }
.sub-pill { padding: 4px 10px; border-radius: 999px; font-size: 11px; white-space: nowrap; background: transparent; color: #766C61; border: 1px solid rgba(245,237,224,0.1); }
.sub-pill.active { background: rgba(212,160,76,0.25); color: #D4A04C; }

/* Stats bar */
.stats-bar { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(245,237,224,0.15); }
.stat { padding: 10px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #A9A299; }
.stat-left { border-right: 1px solid rgba(245,237,224,0.15); }
.stat-num { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 600; color: #FBF6EE; }
.stat-fav.active { background: rgba(194,85,61,0.2); color: #C2553D; }
.stat-fav.active .stat-num { color: #C2553D; }

/* Main */
main { padding: 16px 12px 80px; max-width: 720px; margin: 0 auto; }

/* Cards */
.card { background: #FBF6EE; border-radius: 16px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(43,38,32,0.08); transition: all 0.2s; }
.card.fav { box-shadow: 0 2px 8px var(--cat-color, #C2553D)20; }
.card-inner { padding: 14px; display: flex; gap: 12px; align-items: flex-start; }

/* Heart button */
.heart-btn { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(43,38,32,0.04); border: 1px solid rgba(43,38,32,0.08); transition: all 0.2s; }
.heart-btn.fav { background: var(--cat-color, #C2553D); border: none; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
.heart-btn.pop { animation: pop 0.3s ease-out; }

.card-content { flex: 1; min-width: 0; text-align: left; }
.card-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; line-height: 1.25; color: #2B2620; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.star-icon { color: #D4A04C; flex-shrink: 0; }
.meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 11px; color: #766C61; margin-bottom: 6px; }
.cat-tag { padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; }
.area-tag { display: inline-flex; align-items: center; gap: 2px; }
.price-tag { font-weight: 700; color: #1B5E63; }
.desc { font-size: 12px; line-height: 1.55; color: #4A453F; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.desc.expanded { display: block; }

.details { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
@keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.details { animation: slide 0.25s ease-out; }
.price-note, .closed-note { font-size: 10px; display: inline-flex; align-items: center; gap: 4px; color: #766C61; }
.closed-note { color: #C2553D; }
.tip { font-size: 11px; padding: 8px; border-radius: 8px; background: rgba(212,160,76,0.12); color: #4A453F; line-height: 1.5; display: flex; gap: 6px; }
.tip-icon { flex-shrink: 0; color: #8B6A2E; margin-top: 1px; }
.reserva-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; background: #C2553D; color: #FBF6EE; font-size: 10px; font-weight: 700; align-self: flex-start; }

.chevron-btn { flex-shrink: 0; margin-top: 4px; color: #A9A299; padding: 4px; }

/* Empty state */
.empty { text-align: center; padding: 48px 16px; color: #766C61; font-size: 14px; }

/* Footer */
.footer-msg { background: rgba(27,94,99,0.08); color: #1B5E63; text-align: center; padding: 14px; border-radius: 12px; font-size: 11px; margin-top: 16px; }
.footer-msg strong { font-weight: 700; }
.persist-msg { text-align: center; font-size: 10px; color: #766C61; opacity: 0.5; padding: 8px; }

/* Floating button */
.fab { position: fixed; bottom: 16px; right: 16px; z-index: 30; padding: 12px 16px; border-radius: 999px; background: #C2553D; color: #FBF6EE; box-shadow: 0 4px 12px rgba(194,85,61,0.4); font-size: 12px; font-weight: 600; display: none; align-items: center; gap: 8px; }
.fab.show { display: inline-flex; }

/* Category colors */
.cat-actividad { --cat-color: #C2553D; }
.cat-restaurante { --cat-color: #1B5E63; }
.cat-bar { --cat-color: #8B5CF6; }
.cat-tour { --cat-color: #D4A04C; }

.cat-tag.cat-actividad { background: #C2553D15; color: #C2553D; }
.cat-tag.cat-restaurante { background: #1B5E6315; color: #1B5E63; }
.cat-tag.cat-bar { background: #8B5CF615; color: #8B5CF6; }
.cat-tag.cat-tour { background: #D4A04C15; color: #D4A04C; }

/* Icon (svg helper) */
.icon { display: inline-block; vertical-align: middle; }

/* Print-friendly when sharing */
@media print {
  .header { position: static; }
  .fab { display: none !important; }
}
</style>
</head>

  wine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5V3H7v7a5 5 0 0 0 5 5Z"/></svg>',
  mountain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  chevronDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  chevronUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>',
  dollar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};

function icon(name, size = 12) {
  return '<span class="icon" style="width:' + size + 'px;height:' + size + 'px;display:inline-block;line-height:0">' + ICONS[name] + '</span>';
}

// ============ STATE ============
let state = {
  favorites: {},
  expanded: {},
  activeCat: 'all',
  activeSub: 'all',
  showFavOnly: false,
  search: '',
};

// Load from localStorage
try {
  const saved = localStorage.getItem('cdmx-favs');
  if (saved) state.favorites = JSON.parse(saved);
} catch (e) {}

function saveFavs() {
  try { localStorage.setItem('cdmx-favs', JSON.stringify(state.favorites)); } catch (e) {}
}

// ============ RENDER ============
function renderPills() {
  const container = document.getElementById('catPills');
  const favByCat = { actividad: 0, restaurante: 0, bar: 0, tour: 0 };
  ITEMS.forEach(i => { if (state.favorites[i.id]) favByCat[i.cat]++; });

  container.innerHTML = CATEGORIES.map(c => {
    const active = state.activeCat === c.id;
    const color = c.id === 'actividad' ? '#C2553D' : c.id === 'restaurante' ? '#1B5E63' : c.id === 'bar' ? '#8B5CF6' : c.id === 'tour' ? '#D4A04C' : '#666';
    const bgStyle = active ? 'background:' + color : '';
    const count = c.id !== 'all' && favByCat[c.id] > 0 ? '<span class="count">' + favByCat[c.id] + '</span>' : '';
    return '<button class="pill ' + (active ? 'active' : '') + '" data-cat="' + c.id + '" style="' + bgStyle + '">' + icon(c.icon, 11) + '<span>' + c.label + '</span>' + count + '</button>';
  }).join('');

  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeCat = btn.dataset.cat;
      state.activeSub = 'all';
      render();
    });
  });

  // Sub-pills
  const subWrap = document.getElementById('subPillsWrap');
  if (state.activeCat !== 'all' && SUBCATEGORIES[state.activeCat]) {
    subWrap.style.display = 'block';
    const subs = SUBCATEGORIES[state.activeCat];
    const subContainer = document.getElementById('subPills');
    subContainer.innerHTML = '<button class="sub-pill ' + (state.activeSub === 'all' ? 'active' : '') + '" data-sub="all">Todos</button>' +
      subs.map(s => '<button class="sub-pill ' + (state.activeSub === s.id ? 'active' : '') + '" data-sub="' + s.id + '">' + s.label + '</button>').join('');
    subContainer.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeSub = btn.dataset.sub;
        render();
      });
    });
  } else {
    subWrap.style.display = 'none';
  }
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  const empty = document.getElementById('emptyState');

  const filtered = ITEMS.filter(item => {
    if (state.showFavOnly && !state.favorites[item.id]) return false;
    if (state.activeCat !== 'all' && item.cat !== state.activeCat) return false;
    if (state.activeSub !== 'all' && item.sub !== state.activeSub) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!item.name.toLowerCase().includes(q) && !item.area.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  document.getElementById('countShowing').textContent = filtered.length;

  if (filtered.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = state.showFavOnly ? 'Aún no tienes favoritos en esta categoría' : 'No hay resultados con esos filtros';
  } else {
    empty.style.display = 'none';
    container.innerHTML = filtered.map(item => {
      const isFav = state.favorites[item.id];
      const isExp = state.expanded[item.id];
      const catClass = 'cat-' + item.cat;
      const starHtml = item.star ? '<span class="star-icon" style="width:11px;height:11px;display:inline-block">' + ICONS.star + '</span>' : '';
      const price = item.price === 0 ? 'GRATIS' : '$' + item.price + ' CAD';
      
      let details = '';
      if (isExp) {
        details = '<div class="details">';
        if (item.priceNote) details += '<div class="price-note">' + icon('dollar', 9) + '<span>' + item.priceNote + '</span></div>';
        if (item.cerrado) details += '<div class="closed-note">' + icon('x', 9) + '<span>Cerrado: ' + item.cerrado + '</span></div>';
        if (item.tip) details += '<div class="tip"><span class="tip-icon" style="width:10px;height:10px">' + ICONS.sparkles + '</span><span>' + item.tip + '</span></div>';
        if (item.reserva) details += '<div class="reserva-badge">' + icon('alert', 9) + '<span>NECESITA RESERVACIÓN</span></div>';
        details += '</div>';
      }

      return '<div class="card ' + catClass + ' ' + (isFav ? 'fav' : '') + '">' +
        '<div class="card-inner">' +
          '<button class="heart-btn ' + (isFav ? 'fav' : '') + '" data-id="' + item.id + '" data-action="fav">' + icon('heart', 16) + '</button>' +
          '<div class="card-content" data-id="' + item.id + '" data-action="expand">' +
            '<div class="card-title">' + escapeHtml(item.name) + starHtml + '</div>' +
            '<div class="meta-row">' +
              '<span class="cat-tag ' + catClass + '">' + CAT_LABELS[item.cat] + '</span>' +
              '<span class="area-tag">' + icon('pin', 9) + escapeHtml(item.area) + '</span>' +
              '<span class="price-tag">' + price + '</span>' +
            '</div>' +
            '<div class="desc ' + (isExp ? 'expanded' : '') + '">' + escapeHtml(item.desc) + '</div>' +
            details +
          '</div>' +
          '<button class="chevron-btn" data-id="' + item.id + '" data-action="expand">' + icon(isExp ? 'chevronUp' : 'chevronDown', 16) + '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    // Attach handlers
    container.querySelectorAll('[data-action="fav"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        state.favorites[id] = !state.favorites[id];
        if (!state.favorites[id]) delete state.favorites[id];
        btn.classList.add('pop');
        saveFavs();
        setTimeout(render, 30);
      });
    });
    container.querySelectorAll('[data-action="expand"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        state.expanded[id] = !state.expanded[id];
        render();
      });
    });
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function render() {
  renderPills();
  renderCards();

  const favCount = Object.values(state.favorites).filter(Boolean).length;
  document.getElementById('countFav').textContent = favCount;
  document.getElementById('footerCount').textContent = favCount;

  const favToggle = document.getElementById('favToggle');
  if (state.showFavOnly) favToggle.classList.add('active'); else favToggle.classList.remove('active');

  const resetBtn = document.getElementById('resetBtn');
  resetBtn.style.display = favCount > 0 ? 'inline-flex' : 'none';

  const footerMsg = document.getElementById('footerMsg');
  footerMsg.style.display = (favCount > 0 && !state.showFavOnly) ? 'block' : 'none';

  const fab = document.getElementById('fabBtn');
  document.getElementById('fabText').textContent = state.showFavOnly ? 'Ver todos' : 'Ver mis ' + favCount + ' favoritos';
  if (favCount > 0) fab.classList.add('show'); else fab.classList.remove('show');
}

// ============ EVENT LISTENERS ============
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderCards();
});

document.getElementById('favToggle').addEventListener('click', () => {
  state.showFavOnly = !state.showFavOnly;
  render();
});

document.getElementById('fabBtn').addEventListener('click', () => {
  state.showFavOnly = !state.showFavOnly;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('¿Quitar todos los favoritos?')) {
    state.favorites = {};
    saveFavs();
    render();
  }
});

// Initial render
render();
</script>

</body>
